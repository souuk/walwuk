name: Deploy Walwuk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.6
          actions-cache-folder: .emsdk-cache
      - name: Install dependencies
        run: npm ci
      - name: Validate native engine parity
        run: npm run engine:test:full
      - name: Build native command-line engine
        run: npm run engine:build:native
      - name: Smoke-test native command-line engine
        run: build-native/walwuk-cli analyze 76 4 10 10 0 0 0 2 -1 exhaustive
      - name: Compare native CLI and WebAssembly
        run: npm run engine:test:native-cli
      - name: Audit selective root regret
        run: node scripts/engine-root-audit.mjs --depth 3 --max-regret 100
      - name: Smoke-test resumable campaign runner
        run: node scripts/engine-campaign.mjs --duration-seconds 2 --workers 1 --time-controls 25 --max-depth 3 --max-plies 4 --output outputs/ci-campaign-smoke
      - name: Validate extension packaging
        run: npm run walper:test
      - name: Enforce optional engine asset budget
        run: npm run engine:asset:test
      - name: Lint source
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build extension package
        run: npm run walper:build
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
